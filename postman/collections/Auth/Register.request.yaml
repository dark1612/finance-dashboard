$kind: http-request
name: Register
method: POST
url: '{{base_url}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Yash",
      "email": "yash@example.com",
      "password": "secret123",
      "role": "admin"
    }
